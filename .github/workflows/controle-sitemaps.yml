name: Controle des sitemaps XCR

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/controle-sitemaps.yml'
      - '.github/scripts/Controle-Sitemaps.ps1'

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verifier les sitemaps publics
        shell: pwsh
        run: ./.github/scripts/Controle-Sitemaps.ps1 -ReportPath ./controle-sitemaps.csv
      - name: Archiver le rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controle-sitemaps-${{ github.run_id }}-${{ github.run_attempt }}
          path: controle-sitemaps.csv
          if-no-files-found: error
          retention-days: 30
