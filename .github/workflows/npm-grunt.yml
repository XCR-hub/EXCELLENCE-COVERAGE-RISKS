name: XCR native site

on:
  push:
    branches: [main, migration/cloudflare-server-20261106]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selfhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: selfhost/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
